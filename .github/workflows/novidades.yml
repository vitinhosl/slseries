name: Carimbar novidades

# Roda a cada push que mexe nos dados das séries. Descobre o que entrou desde
# o push anterior e commita as datas em resources/episodes/added.js.
# Os arquivos de dados nunca são alterados.
on:
  push:
    branches: [main, master]
    paths:
      - 'resources/episodes/all/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novidades-${{ github.ref }}
  cancel-in-progress: false

jobs:
  carimbar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Carimbar datas
        env:
          TZ: America/Sao_Paulo
        run: node tools/stamp-novidades.mjs

      - name: Commitar se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/episodes/added.js tools/.novidades-snapshot.json
          if git diff --cached --quiet; then
            echo "nada novo para carimbar"
          else
            git commit -m "chore: carimba novidades [skip ci]"
            git push
          fi
