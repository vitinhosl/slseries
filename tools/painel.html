<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — SL Séries</title>

<!-- =====================================================================
     painel.html — ferramenta interna de catálogo.

       Catálogo  — grade das séries que já existem, por categoria, com o
                   que está faltando em cada uma.
       Adicionar — procura na fonte (TVmaze ou TMDB) e, se a série já
                   estiver no catálogo, oferece completar em vez de
                   duplicar.

     Usa os tokens do próprio site, então acompanha o tema escolhido.

     Rodando com node tools/painel.mjs, grava direto nos arquivos de
     dados (com cópia de segurança). Aberto pelo GitHub Pages, funciona
     em modo consulta: mostra tudo e entrega o bloco pronto ou o arquivo
     alterado para baixar.
     ===================================================================== -->

<script>
	/* Resolve o tema antes de pintar, igual ao index.html do site. */
	(function () {
		var t = 'default';
		try { t = localStorage.getItem('theme') || 'default'; } catch (e) {}
		document.documentElement.dataset.theme = t;
	})();
</script>

<link rel="stylesheet" href="../resources/css/tokens.css">
<link rel="stylesheet" href="../resources/theme/themes.css">
<link rel="stylesheet" href="painel.css">
</head>
<body>

<header class="topo">
	<div class="centro">
		<span class="marca">SL Séries <span>painel</span></span>

		<nav class="abas" role="tablist">
			<button class="aba" role="tab" aria-selected="true" data-painel="catalogo">Catálogo</button>
			<button class="aba" role="tab" aria-selected="false" data-painel="adicionar">Adicionar</button>
		</nav>

		<div class="topo-direita">
			<select id="tema" aria-label="Tema">
				<option value="default">Padrão</option>
				<option value="light">Claro</option>
				<option value="ruined">Ruína</option>
			</select>
			<span class="selo" id="selo-modo">verificando…</span>
		</div>
	</div>
</header>

<main class="centro">

	<!-- ========================== CATÁLOGO ========================== -->
	<section id="painel-catalogo">
		<div id="catalogo-aviso"></div>
		<div class="resumo" id="resumo"></div>

		<div class="barra">
			<input type="text" class="busca" id="busca-catalogo" placeholder="Filtrar por nome…">
			<select id="filtro-categoria"><option value="">Todas as categorias</option></select>
			<select id="filtro-pendencia">
				<option value="">Completas e incompletas</option>
				<option value="falta">Só com algo faltando</option>
				<option value="ok">Só completas</option>
			</select>
			<select id="ordem">
				<option value="az">Nome (A → Z)</option>
				<option value="za">Nome (Z → A)</option>
				<option value="eps">Mais episódios</option>
				<option value="eps-menos">Menos episódios</option>
				<option value="temps">Mais temporadas</option>
				<option value="pendentes">Mais pendências</option>
			</select>
			<button class="acao" id="botao-nova-categoria">Nova categoria</button>
		</div>

		<div id="grade"><p class="vazio">Carregando catálogo…</p></div>
	</section>

	<!-- ========================= ADICIONAR ========================== -->
	<section id="painel-adicionar" hidden>
		<div class="barra">
			<select id="fonte"></select>
			<input type="text" class="busca" id="busca-fonte" placeholder="Nome da série…">
			<input type="password" id="chave-tmdb" placeholder="chave do TMDB" style="width: 190px;" autocomplete="off" hidden>
			<button class="acao forte" id="botao-buscar">Buscar</button>
		</div>
		<p class="vazio" id="obs-fonte" style="padding: 0 0 16px; text-align: left;"></p>

		<div id="busca-aviso"></div>
		<div class="resultados" id="resultados"></div>
	</section>

</main>

<div class="fundo-modal" id="fundo-modal">
	<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
		<div class="modal-topo">
			<h2 id="modal-titulo"></h2>
			<button class="acao fechar" id="modal-fechar">Fechar</button>
		</div>
		<div class="modal-corpo" id="modal-corpo"></div>
		<div class="modal-rodape" id="modal-rodape"></div>
	</div>
</div>

<script type="module" src="painel.js"></script>
</body>
</html>
